<!DOCTYPE html>
<html>
<head>
    <title>Login System</title>

    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:25px;
            border-radius:10px;
            width:300px;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:blue;
            color:white;
            border:none;
        }

        #msg{
            margin-top:10px;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Login Page</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="msg"></p>

</div>

<script>

async function login(){

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const response = await fetch(
        "https://Ankit7577.pythonanywhere.com/login",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        }
    );

    const data = await response.json();

    document.getElementById("msg").innerText = data.message;
}

</script>

</body>
</html>
